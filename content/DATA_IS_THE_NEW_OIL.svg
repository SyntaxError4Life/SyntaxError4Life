<svg xmlns='http://www.w3.org/2000/svg' xmlns:xlink='http://www.w3.org/1999/xlink' viewBox='0 0 500 50' width='500px' height='50px' style='background-color:#000000'>
<style>
.t{font-family:'Fira Code',monospace;font-size:35px;font-weight:700;text-anchor:middle;dominant-baseline:middle}
rect{shape-rendering:crispEdges}
</style>
<text class='t' x='250' y='25' fill='#FFFFFF'>DATA IS THE NEW OIL</text>
<!-- ======== 80% : glitch split (doux) ======== -->
<g fill='#FFFFFF'>
  <text class='t' x='250' y='25' opacity='0'>
    <animate attributeName='opacity' dur='1.8s' repeatCount='indefinite' keyTimes='0;0.74;0.80;0.85;0.90;0.94;1' values='0;0;0.9;0.9;0;0.7;0' />
    <animateTransform attributeName='transform' type='translate' dur='1.8s' repeatCount='indefinite'
      keyTimes='0;0.74;0.76;0.78;0.80;0.82;0.84;0.86;0.88;0.90;0.92;1'
      values='0,0;0,0;-6,0;8,0;-4,0;10,0;-7,0;5,0;-3,0;0,0;0,0;0,0' />
    DATA IS THE NEW OIL
  </text>
  <text class='t' x='250' y='25' opacity='0'>
    <animate attributeName='opacity' dur='1.8s' repeatCount='indefinite' keyTimes='0;0.74;0.82;0.90;1' values='0;0;0.6;0;0' />
    <animateTransform attributeName='transform' type='translate' dur='1.8s' repeatCount='indefinite'
      keyTimes='0;0.74;0.80;0.86;1' values='0,0;0,0;-5,0;3,0;0,0' />
    DATA IS THE NEW OIL
  </text>
  <text class='t' x='250' y='25' opacity='0'>
    <animate attributeName='opacity' dur='1.8s' repeatCount='indefinite' keyTimes='0;0.74;0.80;0.84;1' values='0;0;0.7;0;0' />
    <animateTransform attributeName='transform' type='translate' dur='1.8s' repeatCount='indefinite'
      keyTimes='0;0.74;0.80;0.86;1' values='0,0;0,0;7,0;-4,0;0,0' />
    DATA IS THE NEW OIL
  </text>
</g>
<!-- ======== 20% : déchirure discrète ======== -->
<rect x='0' y='0' width='500' height='2' fill='#FFFFFF' opacity='0'>
  <animate attributeName='y' dur='1.8s' repeatCount='indefinite' keyTimes='0;0.76;0.78;0.80;0.82;0.84;1' values='0;0;8;36;14;28;50' />
  <animate attributeName='opacity' dur='1.8s' repeatCount='indefinite' keyTimes='0;0.76;0.78;0.84;0.86;1' values='0;0;0.6;0.6;0;0' />
</rect>
<rect x='0' y='0' width='500' height='3' fill='#000000' opacity='0'>
  <animate attributeName='y' dur='1.8s' repeatCount='indefinite' keyTimes='0;0.78;0.82;0.86;1' values='0;0;20;10;30' />
  <animate attributeName='opacity' dur='1.8s' repeatCount='indefinite' keyTimes='0;0.78;0.82;0.86;1' values='0;0;1;1;0' />
</rect>
</svg>